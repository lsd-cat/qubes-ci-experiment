# Qubes OS R4.3 unattended install for CI (nested KVM)
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --lock
user --name=user --password=qubesdev --plaintext --gecos="user"
zerombr
clearpart --all --initlabel --drives=vda
ignoredisk --only-use=vda
# --passphrase avoids the interactive LUKS prompt (Qubes forces encryption for autopart)
autopart --type=thinp --encrypted --passphrase=qubesdev
bootloader --location=mbr
poweroff

%post
# kickstart-created users are NOT added to these groups (the GUI installer does it);
# an empty `qubes` group crashes qubesd (IndexError in adminvm.py run_service)
usermod -aG qubes,wheel user

# persistent serial console (Xen -> com1, dom0 kernel -> hvc0), no plymouth
sed -i 's/console=none/console=com1,vga com1=115200,8n1/' /etc/default/grub
grep -q GRUB_CMDLINE_XEN /etc/default/grub || \
  echo 'GRUB_CMDLINE_XEN_DEFAULT="console=com1,vga com1=115200,8n1"' >> /etc/default/grub
sed -i 's/^GRUB_CMDLINE_LINUX="/GRUB_CMDLINE_LINUX="console=tty0 console=hvc0 plymouth.enable=0 rd.plymouth=0 /' /etc/default/grub
grub2-mkconfig -o /boot/grub2/grub.cfg

# skip the graphical Initial Setup: in CI we configure over serial instead
# (templates: qvm-template install --nogpgcheck /var/lib/qubes/template-packages/<t>.rpm,
#  then qubesctl saltutil.sync_all && qubesctl state.sls qvm.sys-net ...)
systemctl disable initial-setup.service initial-setup-graphical.service 2>/dev/null || true
%end
